[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aide-spec-brain"
version = "0.1.0"
description = "Repository-neutral Neo4j and Graphiti context runtime for AIDE"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "azure-identity>=1.25,<2",
  "graphiti-core==0.29.3",
  "httpx>=0.28,<1",
  "mcp==2.1.1",
  "neo4j>=5.26,<7",
]

[project.scripts]
aide-spec-brain = "tools.spec_brain.cli:main"
aide-spec-brain-mcp = "tools.spec_brain.mcp_server:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
