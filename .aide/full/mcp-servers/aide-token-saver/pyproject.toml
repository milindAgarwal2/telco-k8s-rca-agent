[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aide-token-saver"
version = "0.3.1"
description = "Privacy-preserving Kiro context and log metrics for BOS AIDE"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "mcp==2.1.1",
  "typer>=0.17,<1",
]

[project.scripts]
aide-token-saver = "aide_token_saver.cli:main"
aide-token-saver-mcp = "aide_token_saver.server:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aide_token_saver"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
