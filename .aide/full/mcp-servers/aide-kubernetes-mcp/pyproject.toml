[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aide-kubernetes-mcp"
version = "0.1.0"
description = "Bounded project-scoped read-only Kubernetes observation MCP"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = ["mcp==2.1.1"]

[project.scripts]
aide-kubernetes-mcp = "aide_kubernetes_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/aide_kubernetes_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
