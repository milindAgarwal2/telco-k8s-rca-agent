[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aide-knowledge-mcp"
version = "0.1.0"
description = "Read-only MCP retrieval over the repository knowledge base and OpenWiki"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "mcp==2.1.1",
]

[project.scripts]
aide-knowledge-mcp = "aide_knowledge_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aide_knowledge_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

