[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "framework-governance-agent"
version = "0.5.0"
description = "Deterministic framework inventory and SCAS Search 3PP governance assessment exposed to Kiro CLI through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - adapt for your organization" }
authors = [{ name = "Framework Governance Team" }]
dependencies = []

[project.scripts]
framework-governance = "framework_governance.cli:main"
framework-governance-mcp = "framework_governance.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
