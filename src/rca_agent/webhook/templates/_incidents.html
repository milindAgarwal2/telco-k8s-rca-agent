<div class="row g-4">
  <div class="col-lg-7">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <h5 class="mb-0">Incidents</h5>
      <div class="d-flex align-items-center gap-3">
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" id="autorefresh"
                 onchange="var w=document.getElementById('inc-table-wrap');
                   w.setAttribute('hx-trigger', this.checked ? 'load, every 5s' : 'load');
                   htmx.process(w);">
          <label class="form-check-label small text-secondary" for="autorefresh">Auto-refresh</label>
        </div>
        <button class="btn btn-sm btn-outline-secondary"
                hx-get="{{ root }}ui/incidents/table" hx-target="#inc-table-wrap" hx-swap="innerHTML">🔄 Refresh</button>
      </div>
    </div>
    <div id="inc-table-wrap" hx-get="{{ root }}ui/incidents/table" hx-trigger="load" hx-swap="innerHTML">
      <div class="text-secondary small">Loading…</div>
    </div>
  </div>
  <div class="col-lg-5">
    <h5 class="mb-2">Detail</h5>
    <div id="inc-detail" class="border rounded-3 p-3 text-secondary">
      Select an incident on the left to see its ranked hypotheses, evidence chain,
      citations, and suggested next steps.
    </div>
  </div>
</div>
