# BOS AIDE agent-readable run input; not native Kiro config or an executable DSL.
# Copy to loops/runs/STORY-123.yaml and configure it once per story.
# All paths are workspace-relative. No credentials or approval receipts here.
schema_version: "bos-aide-loop-run/v0.2"
run_id: "STORY-123-attempt-01"
story_id: "STORY-123"
story_file: "jira/STORY-123.md" # Replace with an existing local story export.
spec_dir: ".kiro/specs/story-123" # Reviewed requirements.md/design.md/tasks.md.
change_scope: [] # REQUIRED: reviewed exact files or patterns, e.g. src/**.
operation_target: "repository:." # Local repository; external targets are separate.
max_repair_attempts: 3 # Additional cycles after the initial implementation/checks.
evidence_dir: ".aide/local/loops/STORY-123-attempt-01" # Must match run_id.
checks:
