    required: true
    executable: ""
    args: []
    working_directory: "."
    timeout_seconds: 300
    expected_evidence: "Behavior-focused unit results mapped to acceptance criteria."
    acceptance_ids: []
  - name: "integration-tests"
    required: true
    executable: ""
    args: []
    working_directory: "."
    timeout_seconds: 300
    expected_evidence: "Approved local integration results for impacted contracts."
    acceptance_ids: []
  - name: "code-scan"
    required: true
    executable: ""
    args: []
