[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-rca-agent"
version = "0.8.1"
description = "Read-only Kubernetes fault detection & root-cause agent for a 5G core (GraphRAG-style reasoning over a live dependency graph)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Milind" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "networkx>=3.2",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# LangGraph reasoning + LLM ranking. The core runs fine in no-LLM extractive mode without these.
llm = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]
# Live cluster access (Alertmanager/event watchers, kube queries).
cluster = [
    "kubernetes>=29.0",
]
# Interactive graph visualization (pyvis -> vis.js HTML).
viz = [
    "pyvis>=0.3.2",
]
# Local runbook document parsing (the Runbooks dashboard tab). pypdf is pure
# Python -- deliberately lighter than PyMuPDF/Spire.PDF. (python-multipart,
# needed to parse the upload form, is a core dep since the UI ships in-app.)
rag = [
    "pypdf>=4.0",
]
# Per-incident RCA report export (the "Download RCA PPTX" button). python-pptx
# pulls in lxml + Pillow (~38 MB installed / ~14 MB compressed); imported
# lazily so the core service runs without it.
pptx = [
    "python-pptx>=0.6.23",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyvis>=0.3.2",
    "pypdf>=4.0",
    "python-pptx>=0.6.23",
]

[project.scripts]
rca-agent = "rca_agent.webhook.app:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the server-rendered dashboard's templates and vendored Bootstrap/HTMX
# assets inside the wheel/install (not just the .py files).
[tool.setuptools.package-data]
rca_agent = ["webhook/templates/*.html", "webhook/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
