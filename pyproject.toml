[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-rca-agent"
version = "0.12.0"
description = "Read-only Kubernetes fault detection & root-cause agent for a 5G core (GraphRAG-style reasoning over a live dependency graph)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Milind" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "networkx>=3.2",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
]

[project.optional-dependencies]
# LangGraph reasoning + LLM ranking. The core runs fine in no-LLM extractive mode without these.
llm = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]
# Live cluster access (Alertmanager/event watchers, kube queries).
cluster = [
    "kubernetes>=29.0",
]
# Interactive graph visualization (pyvis -> vis.js HTML).
viz = [
    "pyvis>=0.3.2",
]
# Local runbook document parsing (the Runbooks dashboard tab). Structure-aware
# by DEFAULT: pymupdf4llm renders PDFs to markdown, preserving TABLES and the
# kubectl command blocks that the old flat-text path mangled, and extracts
# page IMAGES -- both surfaced in results with citations. pypdf stays as a
# pure-Python fallback when pymupdf4llm/PyMuPDF are unavailable. (python-
# multipart, needed to parse the upload form, is a core dep since the UI
# ships in-app.)
rag = [
    "pymupdf4llm>=0.0.17",
    "pymupdf>=1.24",
    "pypdf>=4.0",
]
# Semantic runbook RAG (opt-in). Upgrades the runbook RETRIEVER from TF-IDF
# keyword overlap to embeddings-based semantic search, reusing the ChatBOT
# stack: fastembed (BAAI/bge-small-en-v1.5 via ONNX -- NO torch/transformers,
# CPU-only, keeps the image lean) + ChromaDB (used IN-MEMORY / ephemeral --
# deliberately NO on-disk sqlite volume, index is rebuilt from the local
# runbook store on startup) + langchain text splitters for markdown-aware
# chunking. Structure-aware extraction and table/image inclusion are NOT here
# -- they are default (the [rag] extra). This opt-in only swaps the scoring:
# gated at runtime behind an opt-in flag AND a live LLM sidecar; if either is
# missing the retriever silently falls back to extractive TF-IDF, so this
# never becomes a hard dependency. Installed size ~120-200 MB.
rag-semantic = [
    "fastembed>=0.3",
    "chromadb>=0.5",
    "langchain-chroma>=0.1",
    "langchain-text-splitters>=0.3",
]
# Per-incident RCA report export (the "Download RCA PPTX" button). python-pptx
# pulls in lxml + Pillow (~38 MB installed / ~14 MB compressed); imported
# lazily so the core service runs without it.
pptx = [
    "python-pptx>=0.6.23",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "hypothesis>=6.0",
    "pyvis>=0.3.2",
    "pypdf>=4.0",
    "python-pptx>=0.6.23",
]

[project.scripts]
rca-agent = "rca_agent.webhook.app:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the server-rendered dashboard's templates and vendored Bootstrap/HTMX
# assets inside the wheel/install (not just the .py files).
[tool.setuptools.package-data]
rca_agent = ["webhook/templates/*.html", "webhook/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Scope linting to the project's own source, tests, and tooling. The AIDE
# support plane (.aide/), generated wiki (openwiki/), and Kiro steering (.kiro/)
# are not application code and are maintained outside this repo's lint gate, so
# they must not block `ruff check .` in scripts/release.sh. (ruff's built-in
# defaults such as .venv/ and egg-info are preserved by extend-exclude.)
extend-exclude = [
    ".aide",
    ".kiro",
    "openwiki",
    "dist",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
