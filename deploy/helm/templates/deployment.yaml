apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rca-agent.fullname" . }}
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rca-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rca-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rca-agent.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
      containers:
        - name: rca-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: RCA_PORT
              value: "{{ .Values.service.port }}"
            - name: RCA_REASONING_MODE
              value: "{{ .Values.agent.reasoningMode }}"
            - name: RCA_CLUSTER_ENABLED
              value: "{{ .Values.agent.clusterEnabled }}"
            - name: RCA_NAMESPACE
              value: "{{ .Values.monitorNamespace }}"
            - name: RCA_LOG_LEVEL
              value: "{{ .Values.agent.logLevel }}"
            - name: RCA_RUNBOOK_RAG_URL
              value: "{{ .Values.agent.runbookRagUrl }}"
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              {{- toYaml .Values.securityContext.capabilities | nindent 14 }}
          # 0.5.0: a single uvicorn process serves both the API and the HTML
          # dashboard on this port, so /healthz and /readyz are reachable again
          # (the 0.3.8-0.4.x Streamlit split had hidden them behind a Unix
          # socket). readyz reflects the background graph build.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        # Writable /tmp for the runbook store and any cache, since the root
        # filesystem itself is read-only. (0.5.0 dropped the FastAPI<->Streamlit
        # Unix socket -- a single uvicorn process now serves everything.)
        - name: tmp
          emptyDir: {}
