apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rca-agent.fullname" . }}
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "rca-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rca-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rca-agent.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
      containers:
        - name: rca-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: RCA_PORT
              value: "{{ .Values.service.port }}"
            - name: RCA_REASONING_MODE
              value: "{{ .Values.agent.reasoningMode }}"
            - name: RCA_CLUSTER_ENABLED
              value: "{{ .Values.agent.clusterEnabled }}"
            - name: RCA_NAMESPACE
              value: "{{ .Values.monitorNamespace }}"
            - name: RCA_LOG_LEVEL
              value: "{{ .Values.agent.logLevel }}"
            - name: RCA_RUNBOOK_RAG_URL
              value: "{{ .Values.agent.runbookRagUrl }}"
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              {{- toYaml .Values.securityContext.capabilities | nindent 14 }}
          # Since 0.3.8: Streamlit is the only process bound to this port (the
          # FastAPI backend is reached over a Unix socket, not a TCP port --
          # see docker/entrypoint.sh) so /healthz and /readyz are no longer
          # reachable here. Streamlit's own health endpoint is the only thing
          # this probe can check now; it can't distinguish "FastAPI's graph
          # build still running" from "ready" the way /readyz used to. This
          # chart has never actually been exercised in-cluster yet (real
          # testing so far has only been plain `docker run` on the Cobra
          # jumpserver) -- fixed for correctness, not yet validated.
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        # Streamlit's config/cache and the FastAPI<->Streamlit Unix socket
        # both live under /tmp -- needs to stay writable even though the
        # root filesystem itself is read-only.
        - name: tmp
          emptyDir: {}
