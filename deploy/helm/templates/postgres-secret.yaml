{{- if and .Values.postgres.enabled .Values.postgres.createCredentialsSecret }}
# PG credentials for the db-pg datastore (Req 6.1). Credentials come ONLY from a
# Secret -- never hardcoded in a manifest or committed with a real value. A real
# deployment MUST supply the password out-of-band, e.g.
#   helm install ... --set postgres.password=<strong-password>
# or point at an externally-managed Secret instead of this one by setting
#   postgres.createCredentialsSecret=false
#   postgres.credentialsSecret=<existing-secret-name>
# The default values.yaml password is empty on purpose; do NOT commit a real one.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.credentialsSecret | default (printf "%s-db-pg" (include "rca-agent.fullname" .)) }}
  labels:
    {{- include "rca-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # Consumed by the StatefulSet's POSTGRES_PASSWORD (postgres-secret key alignment).
  password: {{ .Values.postgres.password | quote }}
  # Full connection URL so the agent can consume a single RCA_DATABASE_URL. The
  # host matches the ClusterIP service name ({{ include "rca-agent.fullname" . }}-db-pg).
  database-url: "postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ include "rca-agent.fullname" . }}-db-pg:5432/{{ .Values.postgres.database }}"
{{- end }}
